<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <meta name="description" content="南柯紀事：以朝代、紀與紀事編次的中國歷史文字與史料。">
  <title>南柯紀事</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="data.js"></script>
  <script>
    window.NANKE_READY = fetch('./南柯紀事-完整備份_周紀三_正文四格縮排.json', { cache: 'no-store' })
      .then(response => {
        if (!response.ok) throw new Error('JSON 載入失敗：' + response.status);
        return response.json();
      })
      .then(latestData => {
        window.NANKE_DATA = latestData;
        return latestData;
      })
      .catch(error => {
        console.warn('改用 data.js 內建資料：', error);
        return window.NANKE_DATA;
      });
  </script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" aria-label="南柯紀事首頁"><span class="brand-mark">柯</span><span class="brand-name">南柯紀事</span></a>
      <nav class="topnav" aria-label="主導覽">
        <a href="#/" data-nav="home">首頁</a>
        <a href="#/contents" data-nav="contents">正文目錄</a>
        <a href="#/sources" data-nav="sources">史料目錄</a>
      </nav>
      <div class="top-actions"><button id="manageBtn" class="text-button" type="button">編輯與備份</button><button id="menuBtn" class="menu-button" type="button" aria-label="開啟目錄" aria-expanded="false">☰</button></div>
    </div>
  </header>
  <div id="mobileShade" class="mobile-shade" hidden></div>
  <div class="site-body">
    <aside id="sidebar" class="sidebar" aria-label="篇目導覽"></aside>
    <main id="main" class="main" tabindex="-1"></main>
  </div>
  <footer class="footer"><span>南柯紀事</span><span>以史為鑑 · 逐事而書</span></footer>
  <dialog id="editorDialog" class="editor-dialog"><div id="editorRoot"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
