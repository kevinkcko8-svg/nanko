<main id="main" class="wrap"><section class="timeline-intro"><p class="eyebrow">CHRONOLOGY · 年代對照</p><h1>中國歷史年表</h1><p>自西元前八四一年、共和元年起，逐年排列西元、史書紀年與事件。未編錄的事件欄保持空白。</p><p class="timeline-note">紀年採逐年對照；尚未核定的朝代紀年暫留白，不以推測填補。西元紀年無零年。</p></section>
<section class="timeline-editor" id="timelineEditor" hidden><h2>年表編輯（作者）</h2><p class="timeline-note">編輯後先儲存至此瀏覽器草稿，再下載 JSON 並上傳覆蓋 GitHub 倉庫的 <code>timeline-data.json</code>，公開網站才會同步更新。</p><label>編輯西元年份 <input id="editYear" type="text" placeholder="前841" value="前841"></label><p id="editLabel" class="timeline-note"></p><label>中國史書紀年（可補充或修改）<input id="editEra" type="text" style="display:block;width:100%;max-width:440px;padding:9px;margin:8px 0;border:1px solid var(--line)"></label><label>事件（可以留白）<textarea id="editEvent" placeholder="輸入當年事件，未填寫則保持空白"></textarea></label><div class="editor-actions"><button id="saveEntry" type="button">儲存此年草稿</button><button id="downloadData" type="button" class="secondary">下載公開年表 JSON</button></div><p id="editorStatus" role="status"></p></section>
