<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>譯文審稿｜南柯紀事</title>
<style>body{background:#f7f5ef;color:#283e32;font:16px/1.8 system-ui,sans-serif;margin:0}main{max-width:1040px;margin:35px auto;padding:0 20px}h1{font-family:serif;margin-bottom:4px}a{color:#3f6752}.note{background:#fff8df;border-left:4px solid #b79b50;padding:12px 16px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}.panel{background:#fffdf8;border:1px solid #dddcd1;padding:18px;border-radius:8px}select{font:inherit;max-width:100%;padding:6px;background:#fffdf8;color:#283e32;border:1px solid #c4c9be;border-radius:5px}textarea{box-sizing:border-box;width:100%;height:65vh;min-height:350px;resize:vertical;padding:12px;border:1px solid #c4c9be;border-radius:5px;font:16px/1.85 system-ui;background:white;color:#222}pre{white-space:pre-wrap;word-break:break-word;font:16px/1.9 serif;max-height:65vh;overflow:auto}button{background:#415d4b;color:white;border:0;border-radius:5px;padding:10px 15px;cursor:pointer;font:inherit;margin:4px 6px 4px 0}.secondary{background:#e6ebe2;color:#304b38}.toolbar{margin:15px 0}.small{font-size:.86rem;color:#637064}@media(max-width:760px){.layout{grid-template-columns:1fr}}</style></head>
<body><main><p><a href="./index.html">← 返回南柯紀事</a></p><h1>白話譯文審稿</h1><p>選擇紀事與小紀事，即可逐節對照、編輯白話譯文。</p><div class="toolbar"><label for="article">紀事：</label><select id="article"></select> <label for="section">小紀事：</label><select id="section"></select></div>
<p class="note"><strong>此工具只在你的瀏覽器內編輯。</strong>修改不會自動發佈，也不會改動 GitHub。審定後請下載完整的 <code>translations.json</code>，上傳替換 GitHub 倉庫 <code>assets/translations.json</code>。不要在此輸入任何 GitHub Token。</p>
<div class="toolbar"><button id="download">下載審定版 JSON</button><button id="copy" class="secondary">複製譯文</button><button id="reset" class="secondary">還原線上譯文</button><span id="status" role="status" class="small">讀取中……</span></div>
<div class="layout"><section class="panel"><h2>史料原文</h2><pre id="original">請先選擇小紀事。</pre></section><section class="panel"><h2>可編輯白話翻譯</h2><textarea id="translation" spellcheck="false" aria-label="編輯白話譯文" placeholder="本節尚無譯文，請在這裡編寫。"></textarea><p class="small">切換小紀事時會保留本次審稿修改，但重新整理頁面會丟失未下載的修改。若要發布，請下載完整 JSON。</p></section></div></main>
<script>
(()=>{'use strict';
const el=id=>document.getElementById(id),status=s=>el('status').textContent=s;
let all={},catalog=[],article='',section='',initial='',drafts={};
function key(a,s){return a+'::'+s}
function saveCurrent(){if(article&&section)drafts[key(article,section)]=el('translation').value}
async function loadArticle(id){
 const response=await fetch('./articles/'+encodeURIComponent(id)+'/');
 if(!response.ok)throw Error('找不到紀事頁');
 const html=await response.text(),doc=new DOMParser().parseFromString(html,'text/html');
 return [...doc.querySelectorAll('.reading-section')].map(x=>({id:x.id,name:x.querySelector('h2')?.textContent?.trim()||x.id,original:x.querySelector('.prose')?.textContent?.trim()||''}))
}
function renderSection(){
 const item=catalog.find(x=>x.id===article),s=item?.sections.find(x=>x.id===section);
 if(!s)return;
 el('original').textContent=s.original||'本節沒有找到史料正文';
 initial=all[article]?.[section]||'';
 el('translation').value=drafts[key(article,section)]??initial;
 status(initial?'已載入譯文；可進行審稿':'本節尚無譯文，可從空白開始撰寫');
}
function switchSection(id){saveCurrent();section=id;renderSection()}
function renderSections(){
 const item=catalog.find(x=>x.id===article);
 el('section').replaceChildren();
 for(const s of item.sections){const opt=new Option(s.name,s.id);el('section').add(opt)}
 section=item.sections[0]?.id||'';
 if(section){el('section').value=section;renderSection()}
}
function switchArticle(id){saveCurrent();article=id;renderSections()}
async function initialize(){
 try{
 const [data,contents]=await Promise.all([
 fetch('./assets/translations.json').then(r=>{if(!r.ok)throw Error('無法讀取翻譯資料');return r.json()}),
 fetch('./contents.html').then(r=>{if(!r.ok)throw Error('無法讀取紀事目錄');return r.text()})
 ]);
 all=data;
 const doc=new DOMParser().parseFromString(contents,'text/html');
 const links=[...doc.querySelectorAll('a.entry-card[href*="/articles/"]')];
 if(!links.length)throw Error('找不到紀事目錄');
 const items=await Promise.all(links.map(async link=>{
 const match=link.getAttribute('href').match(new RegExp('articles/([^/]+)'));
 if(!match)return null;
 const id=match[1];
 try{return {id,name:link.querySelector('h3')?.textContent?.trim()||id,sections:await loadArticle(id)}}catch{return null}
 }));
 catalog=items.filter(x=>x&&x.sections.length);
 if(!catalog.length)throw Error('找不到可編輯的小紀事');
 for(const x of catalog)el('article').add(new Option(x.name,x.id));
 article=catalog[0].id;renderSections();
 }catch(e){el('original').textContent='原文未能載入。';el('translation').placeholder='資料載入失敗，請檢查部署或重新整理。';status('載入失敗：'+e.message)}
}
el('article').addEventListener('change',e=>switchArticle(e.target.value));
el('section').addEventListener('change',e=>switchSection(e.target.value));
el('translation').addEventListener('input',()=>status('已有尚未下載的修改'));
el('reset').addEventListener('click',()=>{
 if(!section)return;if(confirm('還原本節在線上保存的譯文？')){el('translation').value=initial;drafts[key(article,section)]=initial;status('已還原本節譯文')}
});
el('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(el('translation').value);status('譯文已複製')}catch{status('無法存取剪貼簿')}});
el('download').addEventListener('click',()=>{
 if(!catalog.length)return status('請先等候資料載入');
 saveCurrent();const output=JSON.parse(JSON.stringify(all));
 for(const [k,value] of Object.entries(drafts)){
 const split=k.indexOf('::'),aid=k.slice(0,split),sid=k.slice(split+2);
 if(!output[aid])output[aid]={};
 if(value.trim())output[aid][sid]=value;
 else delete output[aid][sid];
 }
 const blob=new Blob([JSON.stringify(output,null,2)+String.fromCharCode(10)],{type:'application/json;charset=utf-8'});
 const url=URL.createObjectURL(blob),link=document.createElement('a');
 link.href=url;link.download='translations.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),5000);
 status('已下載全部譯文資料，請將檔案上傳至 GitHub 的 assets/translations.json');
});
initialize();
})();
</script></body></html>
